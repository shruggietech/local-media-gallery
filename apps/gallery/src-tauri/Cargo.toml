[package]
name = "local-media-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
lite = []
native-tests = ["dep:tauri-plugin-wdio-webdriver", "gallery-core/discovery-tests", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dirs = "=7.0.0"
ctrlc = { version = "=3.5.2", features = ["termination"] }
tokio-util = { version = "0.7", features = ["rt"] }
gallery-core = { path = "../../../crates/gallery-core" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
uuid = { version = "=1.28.0", features = ["v4"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tokio = { version = "=1.54.1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, features = ["NSApplication", "NSEvent", "NSWindow", "NSResponder", "NSGraphicsContext"] }
objc2-foundation = { version = "=0.3.2", optional = true, features = ["NSArray", "NSString", "NSProcessInfo", "NSGeometry"] }
