[package]
name = "local-media-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
native-tests = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
gallery-core = { path = "../../../crates/gallery-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "=1.28.0", features = ["v4"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
tokio = { version = "=1.54.1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "=3.27.0"
