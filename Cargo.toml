[workspace]
members = ["crates/gallery-core", "crates/gallery-preparation", "crates/windows-package", "crates/macos-package", "crates/gallery-update", "apps/gallery/src-tauri"]
resolver = "2"
exclude = ["vendor/glib-0.18.5"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[profile.dev]
debug = 1

[profile.release]
strip = true
lto = "thin"

# GHSA-wrw7-89jp-8q8g: exact upstream iterator fix in the compatible GTK3 family.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
