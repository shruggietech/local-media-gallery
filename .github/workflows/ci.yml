name: Qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        run: echo "CI_PREPARATION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: npm run ci -- repository
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-evidence-${{ github.sha }}
          path: .local/ci-repository.json
          include-hidden-files: true
          if-no-files-found: error
  product-windows:
    name: product-windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        shell: pwsh
        run: '"CI_PREPARATION_STARTED=$([DateTime]::UtcNow.ToString("o"))" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run ci -- product-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: product-windows-evidence-${{ github.sha }}
          path: .local/ci-product-windows.json
          include-hidden-files: true
          if-no-files-found: error
  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        run: echo "CI_PREPARATION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium --no-shell
      - run: npm run ci -- website
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-evidence-${{ github.sha }}
          path: |
            .local/ci-website.json
            .local/site-artifact.json
            .local/site-browser.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: website-static-${{ github.sha }}
          path: apps/site/out/
          include-hidden-files: true
          if-no-files-found: error
