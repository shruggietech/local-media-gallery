name: Qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repository:
    name: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        run: echo "CI_PREPARATION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: npm run ci -- repository
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-evidence-${{ github.sha }}
          path: .local/ci-repository.json
          include-hidden-files: true
          if-no-files-found: error
  product-windows:
    name: product-windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      GALLERY_ISOLATED_DESKTOP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        shell: pwsh
        run: '"CI_PREPARATION_STARTED=$([DateTime]::UtcNow.ToString("o"))" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run ci -- product-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: product-windows-evidence-${{ github.sha }}
          path: |
            .local/ci-product-windows.json
            .local/proof-results.json
            .local/proof-build-*/*-proof.zip
            .local/bin/*native-tests*
            .local/runtime-results*.json
            .local/runtime-fixture.json
            .local/runtime-session-*/*.png
            .local/native-results.json
            .local/preparation-results.json
            .local/launch-results.json
            .local/measurement.json
            .local/normal-results.json
          include-hidden-files: true
          if-no-files-found: error
  native-proof:
    name: native-proof (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            scope: product-linux
          - runner: macos-15
            scope: product-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      GALLERY_ISOLATED_DESKTOP: '1'
      GSETTINGS_BACKEND: keyfile
      XDG_CONFIG_HOME: ${{ github.workspace }}/.local/desktop-config
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        run: echo "CI_PREPARATION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select exact native proof Node
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'GALLERY_PROOF_NODE=' + process.execPath + '\n')"
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf xvfb xauth xdotool dbus-x11 at-spi2-core gir1.2-atspi-2.0 python3-gi gsettings-desktop-schemas pulseaudio pulseaudio-utils gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - run: npm ci
      - name: Run native qualification on isolated Linux display
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' node scripts/ci.mjs ${{ matrix.scope }}
      - name: Run native qualification on isolated macOS desktop
        if: runner.os == 'macOS'
        run: npm run ci -- ${{ matrix.scope }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.scope }}-evidence-${{ github.sha }}
          path: |
            .local/ci-${{ matrix.scope }}.json
            .local/proof-results.json
            .local/proof-build-*/*-proof.tar.gz
            .local/bin/*native-tests*
            .local/runtime-results*.json
            .local/runtime-fixture.json
            .local/runtime-session-*/*.png
          include-hidden-files: true
          if-no-files-found: error
  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start preparation accounting
        run: echo "CI_PREPARATION_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - name: Use primary Ubuntu archive for browser prerequisites
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-browser-downloads
      - run: node node_modules/playwright/cli.js install --with-deps chromium --no-shell
      - run: npm run ci -- website
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-evidence-${{ github.sha }}
          path: |
            .local/ci-website.json
            .local/site-artifact.json
            .local/site-browser.json
            .local/site-visual/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: website-static-${{ github.sha }}
          path: apps/site/out/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: success()
        with:
          name: github-pages-${{ github.sha }}
          path: apps/site/out/
          include-hidden-files: true
  deploy-pages:
    name: deploy-pages
    needs: [repository, product-windows, native-proof, website]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == vars.PAGES_BOOTSTRAP_BRANCH)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-static-${{ github.sha }}
          path: .local/qualified-site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-evidence-${{ github.sha }}
          path: .local/website-evidence
      - name: Verify exact qualified artifact
        run: node scripts/verify-deployment.mjs .local/qualified-site .local/website-evidence/ci-website.json "$GITHUB_SHA"
      - name: Reject retired publishing revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/pull/*/merge ]]; then
            number="${GITHUB_REF#refs/pull/}"
            number="${number%/merge}"
            current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq 'select(.state == "open") | .merge_commit_sha')"
          else
            current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          fi
          test "$current" = "$GITHUB_SHA"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.sha }}
