name: Windows desktop qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-desktop
  cancel-in-progress: false
jobs:
  native-desktop:
    name: native-desktop
    runs-on: [self-hosted, Windows, X64, gallery-desktop]
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      PLAYWRIGHT_BROWSERS_PATH: .local/browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run prepare:local
      - run: node node_modules/playwright/cli.js install chromium --no-shell
      - run: npm run qualify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-desktop-evidence-${{ github.sha }}
          path: |
            .local/qualification.json
            .local/native-results.json
            .local/normal-results.json
            .local/launch-results.json
            .local/proof-results.json
            .local/proof-build-*/*-proof.zip
            .local/site-artifact.json
            .local/site-browser.json
          include-hidden-files: true
          if-no-files-found: error
