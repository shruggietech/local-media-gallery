[package]
name = "gallery-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "lmg-update"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
hex = "=0.4.3"
tempfile = "=3.27.0"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
gallery-windows-package = { path = "../windows-package" }
