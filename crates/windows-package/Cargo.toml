[package]
name = "gallery-windows-package"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "gallery_windows_package"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "gallery-setup"
path = "src/bin/setup.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.1"
hex = "=0.4.3"

[target.'cfg(windows)'.dependencies]
webview2-com-sys = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
